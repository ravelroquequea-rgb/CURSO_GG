<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tabla</title>
    <link rel="stylesheet" href="estilo_cuadro.css">
</head>
<body>

    <table class="tabla">
        <thead>
            <tr>
                <th>Código</th>
                <th>Equipo</th>
                <th>Área</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>EQ-001</td>
                <td>Computadora Dell</td>
                <td>Administración</td>
                <td><span class="estado verde">Operativo</span></td>
            </tr>
            <tr>
                <td>EQ-002</td>
                <td>Laptop HP</td>
                <td>Contabilidad</td>
                <td><span class="estado naranja">Mantenimiento</span></td>
            </tr>
            <tr>
                <td>EQ-003</td>
                <td>Computadora Lenovo</td>
                <td>Informática</td>
                <td><span class="estado verde">Operativo</span></td>
            </tr>
            <tr>
                <td>EQ-004</td>
                <td>Impresora Epson</td>
                <td>Secretaría</td>
                <td><span class="estado rojo">Pendiente</span></td>
            </tr>
        </tbody>
    </table>

</body>
</html>
