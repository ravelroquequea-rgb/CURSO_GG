<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="casillas" content="">
    <title>Tarjetas con Emojis</title>
    <link rel="stylesheet" href="estilo_casilla.css">
</head>
<body>

  
    <div class="cartilla">
        
        <div class="tarjeta tarjeta1">
            <div class="emoji">💻</div>
            <h3 class="titulo_casilla">Total de equipos</h3>
            <div class="cantidad">120</div>
            <h6 class="texto">equipos registrados</h6>
        </div>

        
        <div class="tarjeta tarjeta2">
            <div class="emoji">✔️</div>
            <h3 class="titulo_casilla">Equipos operativos</h3>
            <div class="cantidad">95</div>
            <h6 class="texto">en funcionamiento</h6>
        </div>

        <div class="tarjeta tarjeta3">
            <div class="emoji">🔧</div>
            <h3 class="titulo_casilla">En mantenimiento</h3>
            <div class="cantidad">15</div>
            <h6 class="texto">requieren atencion</h6>
        </div>

        <div class="tarjeta tarjeta4">
            <div class="emoji">⚠️</div>
            <h3 class="titulo_casilla">Incidencias pendientes</h3>
            <div class="cantidad">10</div>
            <h6 class="texto">por resolver</h6>
        </div>

    </div>

</body>
</html>
