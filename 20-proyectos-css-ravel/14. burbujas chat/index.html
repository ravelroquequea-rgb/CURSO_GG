<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Burbujas chat</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="chat-container">
      <div class="bubble-container right">
        <div class="bubble">
          <div class="bubble-text">
            <div>
              <span> Hola, ¿cómo estás?</span>
              <div class="bubble-info">hace 5 min</div>
            </div>
          </div>
        </div>

        <div class="bubble">
          <div class="bubble-text">
            <div>
              <span> ¿Ya terminaste la tarea de CSS?</span>
              <div class="bubble-info">hace 4 min</div>
            </div>
          </div>
        </div>

        <div class="bubble">
          <div class="bubble-text">
            <div>
              <span> Yo ya casi acabo la mía</span>
              <div class="bubble-info">hace 4 min</div>
            </div>
          </div>
        </div>
      </div>

      <div class="bubble-container left">
        <div class="bubble">
          <div class="bubble-text">
            <div>
              <span> Hola</span>
              <div class="bubble-info">hace 3 min</div>
            </div>
          </div>
        </div>

        <div class="bubble">
          <div class="bubble-text">
            <div class="content">
              <span> Sí, ya la terminé ayer, luego te paso mi código</span>
              <div class="bubble-info">hace 2 min</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
