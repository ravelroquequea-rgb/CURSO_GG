<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flip card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="cards">
      <div class="flip-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <img
              src="profile1.jpeg"
              alt="Foto de perfil"
              style="width: 300px; height: 300px"
            />
          </div>
          <div class="flip-card-back">
            <h1>Ravel</h1>
            <p>Estudiante de TI</p>
            <p>Le encanta programar</p>
          </div>
        </div>
      </div>
      <div class="flip-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <img
              src="profile2.jpeg"
              alt="Foto de perfil"
              style="width: 300px; height: 300px"
            />
          </div>
          <div class="flip-card-back">
            <h1>Camila</h1>
            <p>Diseñadora web</p>
            <p>Siempre tiene buenas ideas</p>
          </div>
        </div>
      </div>
      <div class="flip-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <img
              src="profile3.jpeg"
              alt="Foto de perfil"
              style="width: 300px; height: 300px"
            />
          </div>
          <div class="flip-card-back">
            <h1>Diego</h1>
            <p>Programador</p>
            <p>Experto en bases de datos</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
