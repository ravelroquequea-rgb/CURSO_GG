<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarjeta Twitter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="profile-container">
      <div class="profile">
        <img src="profile1.jpeg" alt="Foto de perfil" />
        <div class="info">
          <div class="header">
            <div class="photo">
              <img src="profile1.jpeg" alt="Foto de perfil" />
            </div>
            <div class="action">
              <button>Seguir</button>
            </div>
          </div>
          <div class="user-info">
            <div class="name"><a href="#">Ravel</a></div>
            <div class="username">@ravel</div>
          </div>
          <div class="description">
            Estudiante de día, programador de noche y los fines de semana a descansar.
          </div>

          <div class="followers-container">
            <div class="following">
              <a href="#"> <span class="number">120</span> Siguiendo </a>
            </div>
            <div class="followers">
              <a href="#"> <span class="number">1.5k</span> Seguidores </a>
            </div>
          </div>

          <div class="other">
            <a href="#">
              <div class="photos">
                <img src="profile1.jpeg" alt="Foto de perfil" />
                <img src="profile1.jpeg" alt="Foto de perfil" />
                <img src="profile1.jpeg" alt="Foto de perfil" />
              </div>
              <div class="names">
                Camila, Diego y 80 más de las cuentas que sigues siguen
                a esta cuenta
              </div>
            </a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
