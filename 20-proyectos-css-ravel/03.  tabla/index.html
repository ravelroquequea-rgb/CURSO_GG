<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabla</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <table>
      <caption>
        Mi primera tabla

      <thead>
        <tr>
          <th>Nombre</th>
          <th>País</th>
          <th>Ingresos</th>
          <th>Gastos</th>
          <th>Promedio</th>
          <th>Edad</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>Ravel</td>
          <td>Perú</td>
          <td>$3,500</td>
          <td>$2,100</td>
          <td>8.5</td>
          <td>19</td>
        </tr>
        <tr>
          <td>Camila</td>
          <td>Chile</td>
          <td>$2,800</td>
          <td>$1,900</td>
          <td>7.9</td>
          <td>21</td>
        </tr>
        <tr>
          <td>Diego</td>
          <td>Bolivia</td>
          <td>$4,200</td>
          <td>$2,600</td>
          <td>9.1</td>
          <td>20</td>
        </tr>
        <tr>
          <td>Lucía</td>
          <td>Perú</td>
          <td>$3,100</td>
          <td>$2,000</td>
          <td>8.2</td>
          <td>22</td>
        </tr>
        <tr>
          <td>Mateo</td>
          <td>Argentina</td>
          <td>$3,900</td>
          <td>$2,300</td>
          <td>8.8</td>
          <td>18</td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <th></th>
          <th>Totales:</th>
          <th>$17,500</th>
          <th>$10,900</th>
          <th>8.5</th>
          <th>20</th>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
