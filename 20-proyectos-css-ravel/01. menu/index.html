<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menú responsivo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <!-- menú para celular -->
      <div class="mobile">
        <div class="header">
          <div class="logo">Mi Logo</div>
          <div class="more"><button>Más</button></div>
        </div>
        <div class="links">
          <a href="#">Servicios</a>
          <a href="#">Nosotros</a>
          <a href="#">Contacto</a>
          <a href="#">Buscar</a>
          <a href="#">Registrarse</a>
          <a href="#">Ingresar</a>
        </div>
      </div>
      <!-- menú para computadora -->
      <div class="desktop">
        <div class="logo">Mi Logo</div>

        <div class="primary">
          <a href="#">Servicios</a>
          <a href="#">Nosotros</a>
          <a href="#">Contacto</a>
        </div>

        <div class="secondary full">
          <a href="#">Buscar</a>
          <a href="#">Registrarse</a>
          <a href="#">Ingresar</a>
        </div>
        <div class="secondary mini">
          <a href="#">Más</a>
          <div class="submenu">
            <a href="#">Registrarse</a>
            <a href="#">Ingresar</a>
          </div>
        </div>
      </div>
    </nav>
  </body>
</html>
